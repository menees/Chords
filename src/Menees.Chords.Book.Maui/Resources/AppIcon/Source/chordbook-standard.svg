<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="-12 -2 280 280" role="img" aria-labelledby="title desc">
  <title id="title">ChordBook</title>
  <desc id="desc">Three outlined notebook pages, a blue back cover, four blue spiral coils, and enlarged centered paired eighth notes.</desc>
  <defs>
    <linearGradient id="back" x1="24" y1="35" x2="234" y2="271" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38d6f5"/><stop offset=".58" stop-color="#08b4ed"/><stop offset="1" stop-color="#0878cd"/>
    </linearGradient>
    <linearGradient id="middle" x1="131" y1="24" x2="131" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9fdff"/><stop offset=".55" stop-color="#f2faff"/><stop offset="1" stop-color="#c7e5f3"/>
    </linearGradient>
    <linearGradient id="paper" x1="79" y1="30" x2="175" y2="254" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fafdff"/><stop offset=".48" stop-color="#fff"/><stop offset="1" stop-color="#dceff8"/>
    </linearGradient>
    <linearGradient id="coil" x1="20" y1="58" x2="20" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#41dcfb"/><stop offset=".48" stop-color="#13b9f1"/><stop offset="1" stop-color="#087ec8"/>
    </linearGradient>
    <path id="loop" d="M25 76H21C11 76 11 64 21 64H46"/>
    <clipPath id="visible-coil"><path d="M0 48H64V74H16.5V88H0Z"/></clipPath>
    <g id="rear" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#loop" stroke="#061117" stroke-width="20"/>
      <use href="#loop" stroke="url(#coil)" stroke-width="6"/>
    </g>
    <g id="ring">
      <circle cx="46" cy="64" r="11" fill="#061117"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#visible-coil)">
        <use href="#loop" stroke="#061117" stroke-width="20"/>
        <use href="#loop" stroke="url(#coil)" stroke-width="6"/>
        <path d="M16.5 71H28V74H16.5Z" fill="#061117"/>
        <path d="M17 64Q19 61.5 24 61.5H45" stroke="#a5ecff" stroke-width="2.5"/>
      </g>
    </g>
  </defs>
  <use href="#rear"/><use href="#rear" transform="translate(0 52)"/>
  <use href="#rear" transform="translate(0 104)"/><use href="#rear" transform="translate(0 156)"/>
  <g stroke="#061117" stroke-width="7" stroke-linejoin="round">
    <path d="M35 26L236 32Q251 30 251 45V260Q251 272 238 272H35Q20 272 20 257V44Q20 29 35 26Z" fill="url(#back)"/>
    <path d="M35 29L225 20Q237 19 237 32V247.5Q237 255.5 228 256.5L44 265.4Q35 266 35 257Z" fill="url(#middle)"/>
    <path d="M35 26L214 4Q223 3 223 13V232Q223 240 215 241L44 264.75Q35 266 35 257Z" fill="url(#paper)"/>
  </g>
  <use href="#ring"/><use href="#ring" transform="translate(0 52)"/>
  <use href="#ring" transform="translate(0 104)"/><use href="#ring" transform="translate(0 156)"/>
  <g fill="#061117" transform="translate(-57.3 -38.8) scale(1.35)">
    <path d="M122.4455 91Q122.4455 87 126.4455 86L177.4455 68Q183.4455 66 183.4455 72V151.3481H176.4455V96L129.4455 112V170.3481H122.4455Z"/>
    <ellipse cx="111" cy="173" rx="19" ry="15" transform="rotate(-23 111 173)"/>
    <ellipse cx="165" cy="154" rx="19" ry="15" transform="rotate(-23 165 154)"/>
  </g>
</svg>
